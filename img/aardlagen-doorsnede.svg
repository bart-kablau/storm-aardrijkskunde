<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Doorsnede van de aarde met drie lagen">
  <defs>
    <radialGradient id="kern" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#F2920B"/>
    </radialGradient>
    <radialGradient id="mantel" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#E8632A"/><stop offset="1" stop-color="#A8401C"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#FBF7FA"/>
  <!-- aardkorst (dunne buitenring) -->
  <circle cx="200" cy="150" r="135" fill="#5E7D54"/>
  <circle cx="200" cy="150" r="120" fill="#3D5A38"/>
  <!-- aardmantel -->
  <circle cx="200" cy="150" r="116" fill="url(#mantel)"/>
  <!-- aardkern -->
  <circle cx="200" cy="150" r="52" fill="url(#kern)"/>
  <text x="200" y="292" text-anchor="middle" font-family="Nunito,system-ui,sans-serif" font-size="13" fill="#5A4A55">Doorsnede van de aarde</text>
</svg>
